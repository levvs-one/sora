# mihomo, every platform: the tagged source with mihomo-reality.patch, built by
# mihomo-source.sh, fetch.sh and packaging/android/natives.sh. Windows amd64 is
# built for GOAMD64=v1 like upstream's "compatible" build, so it needs no AVX.
# Windows 7 takes Go 1.20, the last Go that runs there; the archive is the one
# go.dev publishes for the machine that builds. The other builds take the Go
# of upstream's v1.19.34 binaries as a GOTOOLCHAIN, which the go command
# downloads and verifies itself.
