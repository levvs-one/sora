syntax = "proto3";

package sora.custom.v1;

import "sora/core/v1/core_control.proto";

option go_package = "github.com/levvs-one/sora-client/core/gen/sora/custom/v1;customv1";

// CustomServers manages servers the user adds manually, outside
// subscriptions. Every RPC requires control authorization: the shared gRPC
// interceptors admit only control peers (unknown methods default to
// control-only), and each request carries the control authenticator plus an
// API version for the contract check.
//
// Since 1.11. Older cores answer these methods with UNIMPLEMENTED; clients
// must treat that as "custom servers unavailable", not as a failure.
//
// Credentials are write-only: SaveCustomServer accepts them, List and the
// other RPCs never return them, and TestCustomServer never sends them.
service CustomServers {
  // SaveCustomServer creates a server (empty id) or updates an existing one.
  rpc SaveCustomServer(SaveCustomServerRequest) returns (SaveCustomServerResponse);
  // ListCustomServers returns every stored custom server without credentials.
  rpc ListCustomServers(ListCustomServersRequest) returns (ListCustomServersResponse);
  // DeleteCustomServer removes a server together with its stored credentials.
  rpc DeleteCustomServer(DeleteCustomServerRequest) returns (DeleteCustomServerResponse);
  // TestCustomServer checks reachability with a TCP handshake and a timeout.
  // No credentials are sent or returned. The address is resolved with the
  // system DNS resolver, outside any tunnel: probing a server discloses its
  // address to the local network, which is expected for a user-initiated
  // check.
  rpc TestCustomServer(TestCustomServerRequest) returns (TestCustomServerResponse);
}

// CustomProtocol lists the protocols a manually added server may use.
enum CustomProtocol {
  CUSTOM_PROTOCOL_UNSPECIFIED = 0;
  CUSTOM_PROTOCOL_VLESS = 1;
  CUSTOM_PROTOCOL_VMESS = 2;
  CUSTOM_PROTOCOL_TROJAN = 3;
  CUSTOM_PROTOCOL_SHADOWSOCKS = 4;
  CUSTOM_PROTOCOL_WIREGUARD = 5;
}

// CustomServer describes one user-added server. The credentials field is
// write-only: it is accepted by SaveCustomServer and cleared (with
// has_credentials set) on every response.
message CustomServer {
  // Empty on create; the core assigns an id. Immutable afterwards.
  string id = 1;
  // Display name. Limit: 1 to 128 UTF-8 bytes.
  string name = 2;
  CustomProtocol protocol = 3;
  // Hostname or IP literal of the server.
  string address = 4;
  // TCP port, 1 to 65535.
  uint32 port = 5;
  // Write-only secret material (UUID, password, key, ...). Accepted by
  // SaveCustomServer, never returned by any RPC.
  string credentials = 6;
  // True when the core holds credentials for this server. Read-only: the
  // value sent on SaveCustomServer is ignored.
  bool has_credentials = 7;
}

message SaveCustomServerRequest {
  sora.core.v1.ApiVersion api_version = 1;
  bytes control_authenticator = 2;
  CustomServer server = 3;
}

message SaveCustomServerResponse {
  CustomServer server = 1;
  sora.core.v1.SoraError error = 2;
}

message ListCustomServersRequest {
  sora.core.v1.ApiVersion api_version = 1;
  bytes control_authenticator = 2;
}

message ListCustomServersResponse {
  repeated CustomServer servers = 1;
  sora.core.v1.SoraError error = 2;
}

message DeleteCustomServerRequest {
  sora.core.v1.ApiVersion api_version = 1;
  bytes control_authenticator = 2;
  string id = 3;
}

message DeleteCustomServerResponse {
  sora.core.v1.SoraError error = 1;
}

message TestCustomServerRequest {
  sora.core.v1.ApiVersion api_version = 1;
  bytes control_authenticator = 2;
  // Id of the stored server to test.
  string id = 3;
  // Handshake timeout in milliseconds. Clamped to 1000..30000; 0 selects
  // the 5000ms default.
  uint32 timeout_ms = 4;
}

message TestCustomServerResponse {
  // True when the TCP handshake completed within the timeout.
  bool reachable = 1;
  // Handshake round-trip in milliseconds, rounded down. Zero when
  // unreachable or when the handshake took under a millisecond.
  uint64 latency_ms = 2;
  sora.core.v1.SoraError error = 3;
}
