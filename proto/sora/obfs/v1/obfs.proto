syntax = "proto3";

package sora.obfs.v1;

import "sora/core/v1/core_control.proto";

option go_package = "github.com/levvs-one/sora-client/core/gen/sora/obfs/v1;obfsv1";

// ObfsControl is the control-plane API of the obfuscation suite: uTLS
// ClientHello fingerprints, TLS fragmentation and decoy SNI.
//
// The suite keeps one active ObfuscationProfile per core. ApplyObfsProfile
// validates it against what the installed engines really support and stores
// it; the core merges it into the engine plan of every later Connect. A
// restart keeps the stored profile, so a user is never silently left
// without the obfuscation they asked for.
//
// Since 1.11. Clients must negotiate 1.11 before calling: an older core has
// no such service and fails the call at the transport.
service ObfsControl {
  // Validates the profile, expands the preset, stores it as the active
  // profile and reports which engines can carry it. Needs the control
  // authenticator: it changes how every later session looks on the wire.
  rpc ApplyObfsProfile(ApplyObfsProfileRequest) returns (ApplyObfsProfileResponse);
  // Reports what each installed engine really supports: uTLS, TLS
  // fragmentation, jitter and decoy SNI. Needs no authenticator.
  rpc GetObfsCapabilities(GetObfsCapabilitiesRequest) returns (GetObfsCapabilitiesResponse);
}

// UtlsProfile is a uTLS ClientHello parrot. The names are the canonical
// ones from core/engine/fingerprint.go; engines that accept versioned
// parrots (Xray) are listed in GetObfsCapabilities instead of here.
enum UtlsProfile {
  UTLS_PROFILE_UNSPECIFIED = 0;
  UTLS_PROFILE_CHROME = 1;
  UTLS_PROFILE_FIREFOX = 2;
  UTLS_PROFILE_SAFARI = 3;
  UTLS_PROFILE_IOS = 4;
  UTLS_PROFILE_ANDROID = 5;
  UTLS_PROFILE_EDGE = 6;
  UTLS_PROFILE_360 = 7;
  UTLS_PROFILE_QQ = 8;
  UTLS_PROFILE_RANDOM = 9;
  UTLS_PROFILE_RANDOMIZED = 10;
}

// ObfsPreset is a curated starting point. Explicit fields always win over
// the preset, so a preset plus overrides is a custom profile.
enum ObfsPreset {
  OBFS_PRESET_UNSPECIFIED = 0;
  // Clears the active profile: the core stops merging obfuscation.
  // Must arrive with every other field empty.
  OBFS_PRESET_OFF = 1;
  // Chrome parrot with gentle fragmentation.
  OBFS_PRESET_LIGHT = 2;
  // Chrome parrot, smaller fragments, a small randomized delay.
  OBFS_PRESET_BALANCED = 3;
  // Randomized parrot, tiny fragments, larger randomized delay. Costs
  // handshake latency; use where light profiles are fingerprinted.
  OBFS_PRESET_AGGRESSIVE = 4;
}

// ObfuscationProfile describes how proxy handshakes should look on the
// wire. Empty (preset OFF) disables the suite.
message ObfuscationProfile {
  // A preset to start from; explicit fields override it. UNSPECIFIED with
  // explicit fields is a fully custom profile.
  ObfsPreset preset = 1;
  // uTLS ClientHello fingerprint. UNSPECIFIED keeps whatever the
  // subscription or the engine default sets.
  UtlsProfile utls_profile = 2;
  // TLS fragmentation: the ClientHello is split into TCP segments of
  // these sizes in bytes, 1 to 16 entries, each 1..16384. Empty disables
  // fragmentation. Engines that only know an on/off switch (sing-box)
  // fragment with their own sizes; engines with a range grammar (Xray)
  // get min-max of this list.
  repeated uint32 frag_sizes = 3;
  // Pause between fragments in milliseconds, 0..10000. Zero keeps the
  // engine default (Xray falls back to its 10-20 ms range); engines
  // without a delay knob ignore it.
  uint32 frag_delay_ms = 4;
  // Random jitter added on top of frag_delay_ms, 0..10000. Needs
  // frag_delay_ms > 0. Engines without a jitter knob fold it into their
  // delay range (Xray) or ignore it (sing-box).
  uint32 jitter_ms = 5;
  // Decoy SNI sent in the ClientHello instead of the real server name.
  // Dangerous: servers that validate SNI (fallbacks, REALITY targets)
  // will fail the handshake. The core never applies it to REALITY
  // outbounds. Empty keeps the real name.
  string fake_sni = 6;
}

message ApplyObfsProfileRequest {
  sora.core.v1.ApiVersion api_version = 1;
  ObfuscationProfile profile = 2;
}

message ApplyObfsProfileResponse {
  // The profile as stored: preset expanded, fields normalized.
  ObfuscationProfile applied = 1;
  // Engine names ("sing-box", "xray", "mihomo") able to carry every
  // feature the profile enables.
  repeated string compatible_engines = 2;
  // Non-fatal notes, e.g. a feature an engine will silently drop, or the
  // fake_sni risk reminder. Surface them in the UI.
  repeated string warnings = 3;
  sora.core.v1.SoraError error = 4;
}

message GetObfsCapabilitiesRequest {
  sora.core.v1.ApiVersion api_version = 1;
}

message GetObfsCapabilitiesResponse {
  repeated EngineObfsCapabilities engines = 1;
  sora.core.v1.SoraError error = 2;
}

// EngineObfsCapabilities is what one engine really supports, read from
// the renderers in core/engine, not from marketing pages.
message EngineObfsCapabilities {
  // "sing-box", "xray" or "mihomo".
  string engine = 1;
  // The engine can send a uTLS ClientHello parrot.
  bool utls = 2;
  // Canonical profile names the engine accepts (see UtlsProfile).
  repeated string utls_profiles = 3;
  // The engine accepts versioned parrots such as "hellochrome_155".
  bool supports_versioned_parrots = 4;
  // The engine can split the TLS ClientHello across TCP segments.
  bool fragmentation = 5;
  // The engine tunes fragment sizes and delays, not just on/off.
  bool fragment_params = 6;
  // The engine randomizes the inter-fragment delay.
  bool jitter = 7;
  // The engine can send a decoy SNI (via its server-name field).
  bool fake_sni = 8;
}
