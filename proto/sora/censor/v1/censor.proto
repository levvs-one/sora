syntax = "proto3";

package sora.censor.v1;

import "sora/core/v1/core_control.proto";
import "sora/obfs/v1/obfs.proto";

option go_package = "github.com/levvs-one/sora-client/core/gen/sora/censor/v1;censorv1";

// CensorControl diagnoses failed connection attempts: is someone on the path
// interfering, and what routes around it? The session hook runs detection
// automatically on network-level failures and publishes the verdict to the
// journal; this RPC re-runs it on demand, optionally with a fresh active
// probe from the core.
service CensorControl {
  // DetectCensorship classifies one failed attempt. Requires the control
  // authenticator: the request names servers and the response describes the
  // machine's network.
  rpc DetectCensorship(DetectCensorshipRequest) returns (DetectCensorshipResponse);
}

// CensorshipKind is the detector's classification. UNSPECIFIED and UNKNOWN
// both mean "no claim": the evidence did not support a classification.
enum CensorshipKind {
  CENSORSHIP_KIND_UNSPECIFIED = 0;
  CENSORSHIP_KIND_UNKNOWN = 1;
  // The failure carries evidence against censorship (the server answered and
  // refused, or failed its certificate): the server is at fault, not the path.
  CENSORSHIP_KIND_NO_INTERFERENCE = 2;
  CENSORSHIP_KIND_RST_INJECTION = 3;
  CENSORSHIP_KIND_HANDSHAKE_TIMEOUT = 4;
  CENSORSHIP_KIND_DNS_POISONING = 5;
  CENSORSHIP_KIND_SNI_BLOCKING = 6;
  CENSORSHIP_KIND_IP_BLOCKING = 7;
}

// AttemptStage is the connection-stack step an observation belongs to.
enum AttemptStage {
  ATTEMPT_STAGE_UNSPECIFIED = 0;
  ATTEMPT_STAGE_DNS = 1;
  ATTEMPT_STAGE_TCP = 2;
  ATTEMPT_STAGE_TLS = 3;
  ATTEMPT_STAGE_APP = 4;
  ATTEMPT_STAGE_DATA = 5;
}

// AttemptEventKind names what happened: how far the attempt got and who
// closed it. Who closed is the most discriminating signal: a remote reset is
// someone else's decision, a local timeout is ours.
enum AttemptEventKind {
  ATTEMPT_EVENT_KIND_UNSPECIFIED = 0;
  ATTEMPT_EVENT_KIND_RESOLVED = 1;
  ATTEMPT_EVENT_KIND_CONNECTED = 2;
  ATTEMPT_EVENT_KIND_SENT = 3;
  ATTEMPT_EVENT_KIND_RECEIVED = 4;
  ATTEMPT_EVENT_KIND_REMOTE_RESET = 5;
  ATTEMPT_EVENT_KIND_REMOTE_CLOSE = 6;
  ATTEMPT_EVENT_KIND_LOCAL_TIMEOUT = 7;
  ATTEMPT_EVENT_KIND_TLS_ALERT = 8;
  ATTEMPT_EVENT_KIND_ERROR = 9;
}

// AttemptEvent is one wire observation of the failed attempt.
message AttemptEvent {
  AttemptStage stage = 1;
  AttemptEventKind kind = 2;
  // Milliseconds since the attempt started. Timing is what separates an SNI
  // reset (fast, no server bytes) from an idle-session death.
  int64 offset_ms = 3;
  // Cause detail for ERROR/TLS_ALERT ("refused", "nxdomain",
  // "handshake_failure", resolved address for RESOLVED, ...).
  string detail = 4;
}

// ObfuscationProfileRef points at the preset most likely to route around the
// detected interference. The preset is the sora.obfs.v1 contract, so the
// client can hand it straight to ObfsControl.ApplyObfsProfile. It is set
// only for kinds handshake obfuscation actually helps; the rest carry no
// suggestion.
message ObfuscationProfileRef {
  sora.obfs.v1.ObfsPreset preset = 1;
  string display_name = 2;
  string why = 3;
}

// CensorshipVerdict is the detector's answer about one failed attempt.
// Confidence below 0.35 always pairs with UNKNOWN: an uncertain verdict must
// read as uncertainty, never as a weak accusation.
message CensorshipVerdict {
  CensorshipKind kind = 1;
  double confidence = 2;
  ObfuscationProfileRef suggested_profile = 3;
  // Plain-language account of what happened and what helps. Never overstates
  // the evidence.
  string explanation = 4;
  repeated string evidence = 5;
}

message DetectCensorshipRequest {
  sora.core.v1.ApiVersion api_version = 1;
  bytes control_authenticator = 2;
  string request_id = 3;
  // Session whose journal history seeds the attempt. Empty means "use only
  // the events below".
  string session_id = 4;
  string server_id = 5;
  string target_host = 6;
  int32 target_port = 7;
  string sni = 8;
  string protocol = 9;
  // Set when this host resolved or connected before: a sudden NXDOMAIN or
  // silence is then surprising, which is the cheapest strong signal.
  bool known_good_host = 10;
  // Client-observed wire events for the attempt, oldest first.
  repeated AttemptEvent events = 11;
  // Run a fresh active probe from the core (one DNS lookup, one TCP connect,
  // one TLS handshake, tightly bounded) instead of trusting the events.
  bool run_active_probe = 12;
}

message DetectCensorshipResponse {
  CensorshipVerdict verdict = 1;
  // True when the verdict rests on a fresh active probe rather than on
  // supplied events or journal history.
  bool probe_ran = 2;
  sora.core.v1.SoraError error = 3;
}
