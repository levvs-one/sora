# Test fixtures carry key-shaped values on purpose: engines validate key
# lengths, so a test plan needs keys of the right shape. Each value below is a
# throwaway generated for the tests, allowed by its exact text so that any
# other key-shaped string anywhere in the tree is still reported.
[extend]
useDefault = true

[allowlist]
description = "Throwaway keys of the engine test fixtures and upstream documentation examples"
# zapret is vendored unchanged; its WireGuard guide shows an example key.
paths = [
  '''third_party/zapret/docs/wireguard_iproute_openwrt\.txt''',
]
regexes = [
  '''cKE7LmCF61IhqqABGhvJ44jWXp8fKymcMAEVAzLDYVk=''',
  '''MTIzNDU2Nzg5MDEyMzQ1Ng==''',
  # A Shadowsocks cipher name next to a password field, not a key.
  '''2022-blake3-aes-128-gcm''',
  # The redaction test feeds an obviously fake token through the masker.
  '''abcdef123456''',
  # The redaction tests' compound tokens, numbered fakes.
  '''CompoundSecret[0-9]{3}''',
  # WireGuard and sync test vectors: the bytes 0 to 31 (or 0 to 14) in base64.
  '''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=''',
  '''AAECAwQFBgcICQoLDA0O''',
  # "hello-world-key-base64-000" in base64, a credential document fixture.
  '''aGVsbG8td29ybGQta2V5LWJhc2U2NC0wMDA=''',
  # A warning code name, not a key.
  '''shadowsocks-2022-bad-key''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Shared OLCRTC fixture used with example.org and the local SFU"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^app/test/live_olcrtc_test\.dart$''',
  '''^core/control/olcrtc_test\.go$''',
  '''^core/engine/olcrtc/live_test\.go$''',
  '''^core/engine/olcrtc/render_test\.go$''',
  '''^core/engine/registry/olcrtc_test\.go$''',
  '''^core/parser/olcrtc_test\.go$''',
]
regexes = [
  '''^d823fa01cb3e0609b67322f7cf984c4ee2e4ce2e294936fc24ef38c9e59f4799$''',
]
