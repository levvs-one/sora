name: Sora Legacy

on:
  push:
    branches: [legacy]
    paths:
      - 'legacy/**'
      - 'core/**'
      - 'proto/**'
      - '.github/workflows/legacy.yml'
  pull_request:
    branches: [legacy]
    paths:
      - 'legacy/**'
      - 'core/**'
      - 'proto/**'
      - '.github/workflows/legacy.yml'

permissions:
  contents: read

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-windows:
    name: Legacy RPC (${{ matrix.platform }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: '386'
            platform: x86
          - arch: amd64
            platform: x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.424
      - name: Build verified Windows 7 SDK
        shell: pwsh
        run: |
          $env:GOROOT_BOOTSTRAP = go env GOROOT
          $sdk = Join-Path $env:RUNNER_TEMP 'go-win7-1.26.9'
          $archive = Join-Path $env:RUNNER_TEMP 'go-win7.zip'
          Invoke-WebRequest 'https://github.com/XTLS/go-win7/releases/download/current/go-win7-win6-1.26.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4a8ea74640bcdf608fbe351b3eaa5715685b18ec0b0d27e8d59608ade86c8397') { throw 'Unverified Go SDK source' }
          Expand-Archive $archive $sdk
          if ((Get-Content "$sdk\VERSION" -First 1) -ne 'go1.26.9') { throw 'Unexpected Go SDK version' }
          $env:CGO_ENABLED = '0'
          $env:GOTOOLCHAIN = 'local'
          Push-Location "$sdk\src"
          try { cmd /c make.bat; if ($LASTEXITCODE -ne 0) { throw 'Windows 7 SDK build failed' } }
          finally { Pop-Location }
          "$sdk\bin" >> $env:GITHUB_PATH
          "GOROOT=$sdk" >> $env:GITHUB_ENV
          'GOTOOLCHAIN=local' >> $env:GITHUB_ENV
      - name: Build .NET Framework control client
        run: |
          dotnet build legacy/tests/ControlInterop/ControlInterop.csproj -c Release -p:PlatformTarget=${{ matrix.platform }} --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Control client build failed' }
          dotnet build legacy/tests/ServiceInterop/ServiceInterop.csproj -c Release -p:PlatformTarget=${{ matrix.platform }} --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Service client build failed' }
      - name: Exercise native named pipes and x86 ABI
        working-directory: core
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          $env:SORA_INTEROP_CLIENT = (Resolve-Path '../legacy/tests/ControlInterop/bin/Release/net48/ControlInterop.exe').Path
          go test -v ./legacycontrol ./ipc ./diagnostics ./cmd/sora-core
          if ($LASTEXITCODE -ne 0) { throw 'Legacy contract failed' }
          go build -trimpath -ldflags '-s -w -X main.buildVersion=legacy-dev' -o ../legacy/artifacts/sora-legacy-core-${{ matrix.platform }}.exe ./cmd/sora-core
          if ($LASTEXITCODE -ne 0) { throw 'Legacy core build failed' }
      - name: Verify the service from an ordinary Windows account
        shell: pwsh
        run: |
          $core = (Resolve-Path 'legacy/artifacts/sora-legacy-core-${{ matrix.platform }}.exe').Path
          $client = (Resolve-Path 'legacy/tests/ServiceInterop/bin/Release/net48/ServiceInterop.exe').Path
          $data = Join-Path $env:RUNNER_TEMP 'sora-legacy-service-data'
          $checks = Join-Path $env:RUNNER_TEMP 'sora-legacy-user-checks'
          New-Item -ItemType Directory $checks | Out-Null
          $script = Join-Path $checks 'sora-legacy-user.ps1'
          $result = Join-Path $checks 'sora-legacy-user-result.txt'
          $output = Join-Path $checks 'sora-legacy-user-output.txt'
          try {
            & $core --install-service --data-dir $data
            if ($LASTEXITCODE -ne 0) { throw 'Legacy service installation failed' }
            Stop-Service SoraLegacyCore
            & $client --spoof
            if ($LASTEXITCODE -ne 0) { throw 'Legacy pipe spoof was not rejected' }
            Start-Service SoraLegacyCore
            foreach ($path in @((Split-Path $client), $checks)) {
              & icacls.exe $path /grant '*S-1-5-32-545:(OI)(CI)M' /T /Q | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare ordinary-user test outputs' }
            }
            @"
          & '$client' *> '$output'
          `$LASTEXITCODE | Set-Content '$result'
          "@ | Set-Content $script
            Start-Service seclogon
            & runas.exe /trustlevel:0x20000 "powershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$script`""
            for ($i = 0; $i -lt 60 -and -not (Test-Path $result); $i++) { Start-Sleep -Seconds 1 }
            Get-Content $output -ErrorAction SilentlyContinue
            if (-not (Test-Path $result) -or (Get-Content $result) -ne '0') {
              throw 'The ordinary Windows user cannot reach SoraLegacyCore'
            }
          } finally {
            & $core --uninstall-service
            if ($LASTEXITCODE -ne 0) { throw 'Legacy service removal failed' }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: sora-legacy-core-${{ matrix.platform }}
          path: legacy/artifacts/sora-legacy-core-${{ matrix.platform }}.exe
          if-no-files-found: error

  windows-x86:
    name: ${{ matrix.executable }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: legacy
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win7
            executable: sora_win7.exe
          - target: win8
            executable: sora_win8.exe
          - target: win10
            executable: sora_win10.exe
          - target: win11
            executable: sora_win11.exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.424
      - name: Restore
        run: dotnet restore v2rayN\v2rayN\v2rayN.csproj --runtime win7-x86
      - name: Build
        run: dotnet build v2rayN\v2rayN\v2rayN.csproj --configuration Release --runtime win7-x86 --no-restore --property:Platform=x86 --property:SoraWindowsTarget=${{ matrix.target }}
      - name: Subscription regression
        shell: powershell
        run: |
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File tests\Sora.SubscriptionRegression.ps1 -SoraExe "v2rayN\v2rayN\bin\x86\Release\net48\win7-x86\${{ matrix.executable }}"
      - name: Windows 7 QA script compatibility
        shell: powershell
        run: |
          $powershell = "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
          foreach ($script in @(
            'tests\Sora.Dogfood.ps1',
            'tests\Sora.LiveSubscriptionQa.ps1',
            'tests\Sora.LocalVpnPlumbing.ps1',
            'tests\Sora.RealLatencyQa.ps1'
          )) {
            $env:SORA_QA_SCRIPT = (Resolve-Path $script).Path
            & $powershell -NoProfile -Command '$parseErrors = $null; [System.Management.Automation.Language.Parser]::ParseFile($env:SORA_QA_SCRIPT, [ref]$null, [ref]$parseErrors) | Out-Null; if ($parseErrors.Count) { $parseErrors | Out-String | Write-Error; exit 1 }'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: sora-legacy-${{ matrix.target }}-x86
          path: legacy\v2rayN\v2rayN\bin\x86\Release\net48\win7-x86
          if-no-files-found: error
