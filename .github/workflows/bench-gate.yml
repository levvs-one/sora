name: Benchmark gate

# =============================================================================
# Benchmark regression gate — CI integration around tools/bench-baseline.sh.
#
# The mechanism (benchmark discovery, the fixed measurement recipe, the
# comparison, the verdicts) lives in tools/bench-baseline.sh and the
# baseline in tools/bench-baseline.txt; both are documented in that script's
# header. This workflow owns only the CI process around it: when the gate
# runs, which baseline is authoritative, and where the evidence goes. Do not
# re-implement the comparison here — improve the script instead, so local
# runs and CI can never drift apart.
#
# WHY ONLY B/op AND allocs/op ARE GATED (summary; full rationale in the
# script header): ns/op is a wall-clock sample and swings 2-3x for
# identical code on shared runners, so gating on it would be a coin flip.
# B/op and allocs/op are exact allocator counters, reproducible on any
# machine for a given Go toolchain — a regression in them is real. The
# script's default threshold is 5% with absolute floors (+32 B, +1 alloc;
# a zero baseline fails on any new allocation).
#
# WHY A SEPARATE WORKFLOW, not another job in repository.yml:
#   repository.yml shares one top-level `on:` block across all its jobs, so
#   adding `schedule:`/`workflow_dispatch:` there would also re-run the
#   heavy Windows installer and Linux packaging jobs on every nightly or
#   manual run. This file has its own triggers and one Go-only job (plus
#   the baseline tooling). The job is deliberately NOT in repository.yml's
#   `release.needs`: a performance regression must block the PR that
#   introduces it (and be caught nightly on main), but it must never hold
#   a tagged release hostage.
#
# BASELINE RULE FOR PULL REQUESTS: the script reads
#   tools/bench-baseline.txt from the PR tree, so this job checks that
#   file against the PR's BASE branch (checked out separately below) and
#   makes any change loud: a PR that changes the baseline is a
#   baseline-update PR — gated against its own new numbers, but flagged
#   with a warning and a full baseline diff in the log, so quietly
#   raising the baseline to hide a regression inside an unrelated PR is
#   impossible (CODEOWNERS already routes every file to the owner).
#
# HOW TO UPDATE THE BASELINE (intentional performance change):
#   1. Run this workflow manually (workflow_dispatch) with
#      update_baseline=true on the branch with the change. The job runs
#      `tools/bench-baseline.sh --update` and uploads the re-captured
#      tools/bench-baseline.txt as the `bench-baseline-candidate` artifact.
#   2. Download the artifact, review the diff line by line — every raised
#      number must be explained by the change that caused it — and commit
#      it in a PR that touches nothing else (or accept the
#      baseline-update warning by including it in the change's own PR).
#   Locally the same flow is just: tools/bench-baseline.sh --update
#   Never hand-edit baseline numbers you did not measure.
# =============================================================================

on:
  pull_request:
    # The audit branch is listed explicitly while the audit is in flight
    # (the gate must guard PRs into it); drop it once the audit merges and
    # only main remains. The paths filter keeps Dart/docs-only PRs from
    # paying for a Go benchmark run they cannot affect; it must name every
    # tree the script discovers benchmarks in, plus the gate itself.
    branches: [main, 'bugfix/audit-2026-10-19']
    paths:
      - 'core/**'
      - 'service/sync/**'
      - 'tools/**'
      - '.github/workflows/bench-gate.yml'
  workflow_dispatch:
    inputs:
      threshold_pct:
        description: 'Regression threshold in percent (empty = script default, 5)'
        required: false
        default: ''
        type: string
      update_baseline:
        description: 'Re-capture the baseline and upload it as an artifact instead of gating'
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly backstop: catches regressions that reach main without a gated
    # PR (direct pushes, merge queues). GitHub only runs schedules on the
    # default branch, so during the audit phase the PR trigger above is the
    # working gate and this cron becomes effective once the audit is merged.
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: bench-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-gate:
    name: Benchmark regression gate (B/op, allocs/op)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Empty string is fine: the script's ${BENCH_THRESHOLD_PCT:-5}
      # falls back to its 5% default. Set only via workflow_dispatch.
      BENCH_THRESHOLD_PCT: ${{ inputs.threshold_pct }}
      UPDATE_BASELINE: ${{ inputs.update_baseline || false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The base tree supplies the authoritative baseline for pull requests
      # (see header). Skipped for dispatch/schedule, where the checked-out
      # tree's baseline is the only one there is.
      - name: Check out the PR base (baseline source)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-tree
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # The script runs benchmarks in every Go module of the repo
          # (core, service/sync, tools/sora-ext). Same arrangement as
          # security.yml: the toolchain pinned by core/go.mod (go1.27.2)
          # satisfies the older go directives of the other modules.
          go-version-file: core/go.mod
          cache: false

      - name: Check the baseline against the PR base
        if: env.UPDATE_BASELINE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The gate below reads tools/bench-baseline.txt from the PR tree.
          # That is safe only because this step makes any baseline change
          # loud: if the PR touches the baseline, it is a baseline-update
          # PR — gated against its own new numbers (the base numbers would
          # fail it by construction) but flagged so the maintainer reviews
          # every raised number before merge. Quietly raising the baseline
          # inside an unrelated PR is exactly what this warning exists to
          # catch; CODEOWNERS routes the file to the owner regardless.
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            echo 'Baseline: taken from the checked-out tree.'
          elif [ ! -f base-tree/tools/bench-baseline.txt ]; then
            echo '::warning::No baseline file on the PR base yet; gating against the baseline in the PR tree (self-referential until the gate itself lands).'
          elif cmp -s tools/bench-baseline.txt base-tree/tools/bench-baseline.txt; then
            echo 'Baseline: unchanged by this PR (identical to the base copy).'
          else
            echo '::warning::This PR changes tools/bench-baseline.txt — baseline-update PR. Every raised number needs a maintainer-reviewed explanation.'
            diff base-tree/tools/bench-baseline.txt tools/bench-baseline.txt || true
          fi

      - name: Run the benchmark gate
        if: env.UPDATE_BASELINE != 'true'
        shell: bash
        run: |
          set -uo pipefail
          # The script discovers every benchmark package in the repo,
          # measures with its fixed recipe and compares B/op + allocs/op
          # against tools/bench-baseline.txt. Its exit code is the verdict.
          tools/bench-baseline.sh 2>&1 | tee "$RUNNER_TEMP/bench-gate.log"
          exit "${PIPESTATUS[0]}"

      - name: Re-capture the baseline (manual update run)
        if: env.UPDATE_BASELINE == 'true'
        shell: bash
        run: |
          set -uo pipefail
          tools/bench-baseline.sh --update 2>&1 | tee "$RUNNER_TEMP/bench-gate.log"
          exit "${PIPESTATUS[0]}"

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bench-gate-log
          path: ${{ runner.temp }}/bench-gate.log
          if-no-files-found: ignore

      - name: Upload baseline candidate
        if: inputs.update_baseline
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bench-baseline-candidate
          path: tools/bench-baseline.txt
          if-no-files-found: error
