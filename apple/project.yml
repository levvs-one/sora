# XcodeGen spec for the Sora Apple clients. Generate with:
#   xcodegen generate --spec project.yml   (see docs/BUILD-MAC.md)
#
# Bundle IDs are canonical per docs/ARCHITECTURE.md §3.4 (single source
# of truth): base `io.github.levvs-one.sora` for BOTH apps, App Group
# `group.io.github.levvs-one.sora`, keychain group
# `$(AppIdentifierPrefix)io.github.levvs-one.sora`.
# KNOWN CONFLICT (flagged, not silently resolved): macOS app code in
# Apps/macOS/SoraMac/Core/AppIdentifiers.swift currently uses `dev.sora.*`
# ids and a `group.dev.sora.app` group. Per ARCHITECTURE.md §3.4 the doc
# changes first, then the code - the app department must align that file.
#
# Deployment targets (ARCHITECTURE.md decision): iOS 15.0 / macOS 13.0.
# libbox for Apple floors at iOS 15.0 / macOS 13.0, so macOS 11-12 are NOT
# supported by the main targets; the 11-12 fallbacks in sibling code
# (NSStatusItem, login-item helper) matter only for a hypothetical legacy
# target (see docs/BUILD-MAC.md capability matrix).
name: Sora
options:
  bundleIdPrefix: io.github.levvs-one
  deploymentTarget:
    iOS: "15.0"
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  SoraCore:
    path: SoraCore
settings:
  base:
    MARKETING_VERSION: "1.0.12"
    CURRENT_PROJECT_VERSION: "13"
    SWIFT_VERSION: "5.9"
    # Signing is intentionally parameterised: set these in Xcode or via
    # xcconfig/CI secrets. No team id or certificate name is committed.
    DEVELOPMENT_TEAM: "$(SORA_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "$(SORA_CODE_SIGN_IDENTITY)"
targets:
  SoraIOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
        excludes: ["Widgets/**", "Intents/**"]
      - path: Localizations/Localizable.xcstrings
      - path: Assets/Media.xcassets
    dependencies:
      - package: SoraCore
      - target: PacketTunnelIOS
        embed: true
      - target: SoraWidgetsIOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.levvs-one.sora
        INFOPLIST_KEY_CFBundleDisplayName: Sora
        TARGETED_DEVICE_FAMILY: "1,2"
  SoraMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/SoraMac
      - path: Localizations/Localizable.xcstrings
      - path: Assets/Media.xcassets
    dependencies:
      - package: SoraCore
      - target: PacketTunnelMac
        embed: true
      - target: SoraWidgetsMac
        embed: true
      - target: SoraLoginItemHelper
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.levvs-one.sora
        INFOPLIST_KEY_CFBundleDisplayName: Sora
  PacketTunnelIOS:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    dependencies:
      - package: SoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.levvs-one.sora.PacketTunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
  PacketTunnelMac:
    type: system-extension
    platform: macOS
    sources:
      - path: PacketTunnel
      - path: Apps/macOS/SystemExtension
    dependencies:
      - package: SoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.levvs-one.sora.PacketTunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
  SoraWidgetsIOS:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/iOS/Widgets
    dependencies:
      - package: SoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.levvs-one.sora.Widgets
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SoraWidgetsMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Apps/macOS/Widgets
    dependencies:
      - package: SoraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.levvs-one.sora.Widgets
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SoraLoginItemHelper:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/LoginItemHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.levvs-one.sora.LoginItemHelper # not in ARCHITECTURE.md 3.4 - TODO-verify; legacy pre-13 path only
        SKIP_INSTALL: true
        INFOPLIST_KEY_LSBackgroundOnly: true
schemes:
  SoraIOS:
    build:
      targets: {SoraIOS: all}
    run: {config: Debug}
    archive: {config: Release}
  SoraMac:
    build:
      targets: {SoraMac: all}
    run: {config: Debug}
    archive: {config: Release}
configs:
  Debug: debug
  Release: release
