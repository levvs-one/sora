# Legacy engine pins for the Apple legacy tiers (apple/Legacy), measured
# 2026-10-21 by the legacy-engine-pin sub-department. Format mirrors
# packaging/engines/engines.lock: engine  arch  sha256  url
# Every SHA-256 below was measured with sha256sum on the artifact actually
# downloaded to ~/workspace/.legacy-engines/, not copied from a web page.
# "src" lines pin the source archive the libbox is built from (neither fork
# publishes a Libbox.xcframework asset; see apple/Legacy/ENGINES.md §2.3).
# Arch-column extension versus the packaging sample, explicit on purpose:
# "src" and "src-v<version>" denote source archives (the gomobile lines
# below), "linux-amd64" a measured desktop binary; a parser of this file
# must accept these values in addition to the sample's binary arches.
# "linux-amd64" lines pin the official desktop binary the `sing-box check`
# corpus runs of ENGINES.md §5 were executed with.
