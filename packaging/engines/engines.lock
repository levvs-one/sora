# olcrtc: the OpenLibre sidecar. Upstream publishes NO release binaries at
# all (the GitHub releases list is empty; its own install.sh builds from
# source), so the pin is a build from the v0.0.1 tag (commit
# 3e42ae98d81280242ad38582896fc47d56dc62c0). The digest below is the SHA-256
# of the GitHub source archive of that tag, measured by downloading it on
# 2026-10-21; fetch.sh verifies the archive against it, builds
# ./cmd/olcrtc per architecture (CGO off, -trimpath -ldflags="-s -w", the
# upstream install.sh flags), and records the built binary's own digest in
# engines.digests like every other engine. No win7-386 line: olcrtc's Go
# toolchain (go 1.26+) no longer targets Windows 7, so olcrtc servers are
# honestly unavailable there.
olcrtc    amd64          acaaee246e876aed83fd6a21f77c1ff7a8093584ee5a36453ab1803f9a2bcca7  https://github.com/openlibrecommunity/olcrtc/archive/refs/tags/v0.0.1.tar.gz
